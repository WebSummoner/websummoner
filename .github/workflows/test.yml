name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  golang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version: ~1.27.0
          cache: true

      - name: Test
        run: ci/test.sh

      - name: Build
        run: ci/build.sh

      - uses: codecov/codecov-action@v7
        with:
          files: coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: WebSummoner/websummoner
          flags: go
