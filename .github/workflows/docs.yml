name: docs

# Custom docs pipeline for the Starlight site in docs-site/.
#
#  - Push to master  -> build + deploy to GitHub Pages (websummoner.github.io/websummoner)
#  - Pull request    -> build only, so broken Markdown/links fail the check early
#  - workflow_dispatch -> manual deploy, e.g. after enabling Pages or changing config
#
# First-time setup (once, in repository Settings -> Pages): choose
# "GitHub Actions" as the Build and deployment source.

on:
  push:
    branches: [master]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Allow only one deploy at a time; cancel in-flight runs on new pushes.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: docs-site/.nvmrc
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site (Pagefind index + llms.txt)
        run: npm run build

      # astro build fails on dead internal links by itself; the explicit check
      # surfaces a friendlier error message on PRs.
      - name: Check for empty build output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/llms.txt || { echo "::error::llms.txt missing"; exit 1; }

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
