name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  golang:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version: ~1.27.0
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Test
        run: ci/test.sh

      - name: Build
        run: ci/build.sh

      - name: Prepare release version
        run: echo "RELEASE_VERSION=${GITHUB_REF:10}" >> $GITHUB_ENV

      - name: Upload release assets
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: ci/docker-push.sh "$RELEASE_VERSION" latest-release

  # Supply-chain hygiene for the released Docker image:
  #   - SPDX SBOM generated with Syft and attached to the GitHub release
  #   - keyless (OIDC) signature over the image with Cosign
  supply-chain:
    runs-on: ubuntu-latest
    needs: [golang]
    permissions:
      contents: write      # attach SBOM to the release
      id-token: write      # cosign keyless signing
    steps:
      - name: Prepare release version
        run: echo "RELEASE_VERSION=${GITHUB_REF:10}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: latest

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Generate SBOM
        run: |
          IMAGE="docker.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]'):${RELEASE_VERSION}"
          syft "${IMAGE}" -o spdx-json > "websummoner-${RELEASE_VERSION}-sbom.spdx.json"
          head -c 200 "websummoner-${RELEASE_VERSION}-sbom.spdx.json"

      - name: Sign image (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          IMAGE="docker.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]'):${RELEASE_VERSION}"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          cosign sign "docker.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')@${DIGEST}"

      - name: Attach SBOM to release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: websummoner-*-sbom.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
