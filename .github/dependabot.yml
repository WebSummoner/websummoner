# Dependency updates via GitHub Dependabot.
# Weekly cadence keeps the manual CVE sweeps unnecessary; pull requests are
# grouped so a repository gets one reviewable bump per ecosystem.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/docs-site"
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
